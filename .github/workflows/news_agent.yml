name: Autonomous AI News Automation Agent

on:
  schedule:
    # Runs automatically every 30 minutes on GitHub Cloud
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-news-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous AI News Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_KEYFILE }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.SECRETFILE }}
          NEWS_COLLECTION_INTERVAL_MINUTES: "30"
          MAX_QUEUE_SIZE: "20"
          POSTS_PER_CATEGORY: "1"
        run: |
          python main.py --cron

      - name: Save published history to repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json data/ || true
          git diff-index --quiet HEAD || git commit -m "Auto-update published news history [skip ci]"
          git push || true
